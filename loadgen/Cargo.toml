[package]
name = "byoc-loadgen"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["behavior-version-latest", "http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "1.5.0", features = ["rustls-ring"] }
aws-smithy-types = "1.8.1"
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
libc = "0.2.190"
md-5 = "0.11.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-std", "io-util", "net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[profile.release]
# One binary, with full optimization, for a load generator that must not be
# the bottleneck it is trying to measure.
lto = "thin"
codegen-units = 1

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
